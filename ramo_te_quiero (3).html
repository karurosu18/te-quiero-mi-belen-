<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<title>Para mi princess 💙</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&display=swap');

  :root{
    --sky-deep:  #3f5fd6;
    --sky-mid:   #8ba0ef;
    --ink:       #2b3560;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(ellipse at 30% 15%, #eaf1ff 0%, transparent 55%),
      radial-gradient(ellipse at 75% 85%, #dfe9ff 0%, transparent 55%),
      linear-gradient(160deg, #f7f8ff 0%, #eef1fb 55%, #e7ecfb 100%);
    font-family: 'Cormorant Garamond', serif;
    padding: 40px 16px;
  }

  .scene{ position:relative; width:290px; max-width:100%; }

  .bouquet-wrap{
    filter: drop-shadow(0 12px 16px rgba(40,50,110,0.20));
  }

  .flower-anim{
    transform-box: fill-box;
    transform-origin: center;
    animation: sway 6s ease-in-out infinite;
  }
  .flower-pos:nth-of-type(even) .flower-anim{ animation-duration: 7.2s; animation-delay: -1.5s; }

  @keyframes sway{
    0%,100%{ transform: rotate(0deg); }
    50%{ transform: rotate(2deg); }
  }

  .card{
    position:relative;
    margin-top:-6px;
    background: linear-gradient(180deg, #ffffff, #f6f8ff);
    border: 1px solid #dfe6fb;
    border-radius: 18px;
    padding: 24px 20px 20px;
    text-align:center;
    box-shadow: 0 18px 40px -12px rgba(63,95,214,0.28), 0 2px 8px rgba(63,95,214,0.08);
    z-index: 5;
  }
  .card::before{
    content:"❀";
    position:absolute;
    top:-16px; left:50%;
    transform:translateX(-50%);
    width:32px; height:32px;
    background: var(--sky-deep);
    color:#fff;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:15px;
    box-shadow:0 6px 14px rgba(63,95,214,0.45);
  }

  .eyebrow{
    font-family:'Caveat', cursive;
    color: var(--sky-deep);
    font-size:18px;
    letter-spacing:1px;
    margin: 4px 0 2px;
  }

  .message{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size: 28px;
    line-height:1.15;
    color: var(--ink);
    margin: 4px 0 10px;
  }
  .message .accent{ color: var(--sky-deep); }

  .submessage{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:15px;
    color:#54608f;
    line-height:1.5;
    max-width:280px;
    margin: 0 auto;
  }

  .signature{
    margin-top:14px;
    font-family:'Caveat', cursive;
    font-size:18px;
    color: var(--sky-deep);
  }
</style>
</head>
